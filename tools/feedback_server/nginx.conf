# В http { … } (например, /etc/nginx/conf.d/st-feedback.conf):
limit_req_zone $server_name zone=st_feedback:1m rate=20r/m;

# В server { … } сайта с HTTPS:
location = /api/feedback {
    limit_req zone=st_feedback burst=20 nodelay;
    limit_req_status 429;
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:8090;
    proxy_request_buffering on;
    proxy_read_timeout 60s;
}
location ^~ /api/pickup {
    client_max_body_size 1k;
    proxy_pass http://127.0.0.1:8090;
}
location = /api/health {
    proxy_pass http://127.0.0.1:8090;
}
