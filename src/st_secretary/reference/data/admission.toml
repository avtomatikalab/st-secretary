# Требования к участникам по дисциплинам (Правила вида спорта, раздел 3).
# Возраст считается по году: «спортсмен должен достичь установленного возраста в календарный год
# проведения спортивных соревнований» (раздел 3, п. 5.1). Возрастная группа связки/группы
# определяется по самому старшему участнику (там же).
#
# min_qualification — минимальный разряд (коды см. qualification.py): III, II, I, KMS, Y1 …
# Для пешеходных 5 класса допустимы два варианта: 16 лет и КМС или 17 лет и I — заданы через options.

# ---------------------------------------------------------------- ПСР / дистанция – комбинированная
# Часть 4 раздела 3, таблица 1 и пп. 2.1.5, 2.1.7.
[profile.psr]
source = "Правила, раздел 3, часть 4, таблица 1"
disciplines = ["0840161811Я"]
leader_min_age = 18          # руководитель команды старше 18 лет на день начала соревнований
leader_min_age_class_5_6 = 20

[[profile.psr.age_group]]
name = "мальчики, девочки"
min = 10
max = 13
classes = [1, 2]

[[profile.psr.age_group]]
name = "юноши, девушки"
min = 14
max = 15
classes = [1, 2, 3]

[[profile.psr.age_group]]
name = "юниоры, юниорки"
min = 16
max = 21
classes = [1, 2, 3, 4, 5]

[[profile.psr.age_group]]
name = "юниоры, юниорки (студенты)"
min = 17
max = 25
classes = [1, 2, 3, 4]
students_only = true

[[profile.psr.age_group]]
name = "мужчины, женщины"
min = 22
classes = [1, 2, 3, 4, 5, 6]

