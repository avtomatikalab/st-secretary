note = "См. п. 1.5.5.1, п.п. 4–6 таблицы 12. Предупреждение (штраф) выносится только в отношении снаряжения, оставшегося подключённым к судейскому оборудованию этапа. Предупреждение выносится после прохождения ОЗ этапа участником (всеми участниками связки/группы) и освобождения судейского оборудования от основного специального снаряжения участника (связки, группы)."

