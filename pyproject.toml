[project]
name = "st-secretary"
version = "0.1.0"
description = "СТ-Секретарь: система для секретариата и судей соревнований по спортивному туризму"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# openpyxl — чтение и запись xlsx (карточка соревнования, предзаявки, сводки для секретаря).
# fastapi, uvicorn, jinja2, python-multipart — интерфейс в браузере (локальный сервер на ноутбуке).
dependencies = [
    "openpyxl>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "python-docx>=1.1",  # документы Word: дипломы, справки, отчёт
    "pypdf>=4",  # текст из PDF — для сверки документов (договоры заказчика часто приходят в PDF)
    "segno>=1.6",  # QR-код адреса табло — навести камеру телефона
]

[project.scripts]
st-secretary = "st_secretary.cli:main"

[project.optional-dependencies]
# Чтение старых книг Excel (.xls): СЕКРЕТАРЬ_ST, протоколы прошлых лет.
xls = ["xlrd>=2.0"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "xlrd>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/st_secretary"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Явный набор правил: версия ruff не должна менять, что считается замечанием.
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "RUF", "PERF", "FURB", "FLY", "PYI", "PLC", "S102", "S606"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # кириллица, «кавычки-ёлочки», тире и × в текстах — так и нужно
    "PLC0415",  # импорт внутри функции — нарочно: быстрый запуск, необязательные библиотеки, без циклов импорта
    "B905",  # zip без strict: длины равны по построению
    "RUF005", "PERF401", "SIM105",  # дело вкуса: [*a, b], списки в цикле, try/except/pass
]

[tool.ruff.lint.pycodestyle]
max-line-length = 130  # длинные сообщения по-русски не рвём посередине фразы

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
