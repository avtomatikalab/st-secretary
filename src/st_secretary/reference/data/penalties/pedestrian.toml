[[row]]
code = "12.1"
title = "Отсутствие самостраховки"
points = "10 баллов (см. п. 6.3.2)"
value = 10
nopenalty = "См. п. 6.2.4.1"
note = "— Касание рельефа в ОЗ этапа любой частью тела участника, не готового выполнить ТП согласно условиям прохождения этапа (не находящегося на самостраховке, не подключенного к перилам и т.п.). — Участник, находящийся в ОЗ этапа, не подключен самостраховкой к перилам или ТО, когда это необходимо по Условиям. — Защёлка карабина, используемого для самостраховки, или карабина, которым закреплены перила, открыта. — Не выполнено требование п. 1.3.1.1 при переходе участника с одного этапа блока на другой. — Страхующий участник не подключен самостраховкой к ТО (см. п. 7.3.4). — Перемещение в ОЗ при выполнении ТП по п.п. 7.10.12, 7.10.13, 7.12.5."

[[row]]
code = "12.2"
title = "Отсутствие страховки"
points = "10 баллов (см. п. 6.3.2)"
value = 10
nopenalty = "См. п. 6.2.4.1"
note = "— Перильная верёвка не удерживается рукой, расположенной после ФСУ (регулирующей рукой) (п. 7.10.8). — Перильная верёвка не удерживается участником при выполнении ТП по п.п. 7.17, 7.18. — Касание рельефа в ОЗ этапа любой частью тела участника, не готового выполнить ТП согласно условиям прохождения этапа (не находящегося на страховке). — Страховочная верёвка не подключена к страхуемому участнику (см. п.п. 7.1.1, 7.2.1, 7.3.2). — Провис страховочной верёвки ниже указанного в п. 7.3.7 уровня. — Защёлка карабина, используемого для страховки, открыта. — Страховочная верёвка не проходит через карабин на ТО этапа, через которую должна осуществляться страховка. — Страховочная верёвка проходит через карабины не на всех ТО, идущих от страхующего до страхуемого участника (см. п. 7.3.1), если иное не оговорено в условиях прохождения этапа. — Страховочная верёвка проходит через карабин на ТО, но не проходит через ФСУ, закреплённое в соответствии с приложением 1 или на ТО (см. п. 7.3.1). — Страхующий участник не находится в БЗ, если иное не оговорено условиями этапа (см. п. 7.3.1). — Страховочная верёвка не удерживается страхующим участником рукой ниже (после) ФСУ (п. 7.3.5). — Не закреплён свободный конец страховочной верёвки (п. 7.3.3). — Пропуск ППС (страховочная верёвка не подключена через карабин на ППС), если при этом: ступни страхуемого участника находятся выше ППС (см. п. 7.4.1), страховочная верёвка подключена через следующий ППС, страхуемый участник достиг ЦС этапа (см. п.п. 7.4.1, 7.5.1). — Перемещение в ОЗ при выполнении ТП по п. 7.3.6."

