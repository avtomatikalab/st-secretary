# Нормы, требования и условия их выполнения по виду спорта «спортивный туризм» на 2026–2029 годы.
# Реквизиты приказа в исходном файле не заполнены («от «__» ____ 2025 г. №__»). По решению
# организаторов (28.09.2026) редакция считается действующей; в соревновании выбирается явно.
# Источник: Normy_26-29.xls, лист «Нормы-дистанции+СХ» — раздел 4 «Нормы и условия их выполнения
# для присвоения I–III спортивных разрядов, юношеских спортивных разрядов» (группа «дистанция» и
# северная ходьба). Строки ранга 700–2400 в файле без отметки класса — отнесены к классам 5–6,
# как в редакции 2022–2025 (там отметка есть).
#
# Как читать таблицу:
#   * row.min — нижняя граница квалификационного ранга строки (строка действует до min следующей строки
#     в пределах своего класса; «N и более» — до конца диапазона класса);
#   * class_rows — какие строки относятся к каждому классу дистанции (в документе — незакрашенные
#     ячейки столбцов «Класс дистанции»); ранг ниже первой строки класса — нормы не выполняются;
#   * пороги — «результат участника в процентах от результата победителя (не более)»;
#     отсутствующий ключ = разряд в этой строке не присваивается (ячейка закрашена).

edition = "2026-2029"
title = "Нормы 2026–2029 (реквизиты приказа уточняются)"
valid_from = "2026-01-01"
valid_to = "2029-12-31"

[source]             # документ — копия в программе (reference/docs, без интернета); на сайте ФСТР нет (Правки, п. 59)
doc = "Normy_26-29.xls"
url = ""             # на tssr.ru (06.10.2026) этой редакции нет
# копия файла с семинара: в свойствах файла имя и адрес автора заменены пробелами, таблицы — без изменений
note = "Проект ФСТР: реквизиты приказа в файле не указаны — проверьте, что редакция действует. Файл — с судейского семинара 2026; на сайте ФСТР (tssr.ru) на 06.10.2026 не опубликован."

[min_age]            # «выполняется с N лет» (достичь в календарный год соревнований)
I = 13
II = 12
III = 11
junior = 10

[nordic_walking]     # особенности для дисциплины «северная ходьба»
I_allowed = true     # в редакции 2026–2029 I разряд для северной ходьбы не исключён
min_age_I_II_III = 18

[status]             # «иные условия», п. 5–7
I = "regional"       # не ниже статуса других официальных спортивных соревнований субъекта РФ
II = "municipal"     # не ниже статуса первенства муниципального образования
III = "any"
junior = "any"

[class_rows]         # диапазон строк (по min) для каждого класса дистанции
1 = [0, 10]
2 = [0, 40]
3 = [20, 160]
4 = [63, 630]
5 = [200, 2400]
6 = [200, 2400]

