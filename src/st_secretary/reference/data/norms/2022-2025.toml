# Баллы квалификационного ранга («иные условия», п. 1): начисляются за каждого спортсмена,
# занявшего с 1 по 6 место, при участии в виде программы не менее 6 спортсменов (связок, экипажей,
# групп). Здесь — значения для личных дисциплин; для связок и групп они делятся (см. vrvs.toml).
