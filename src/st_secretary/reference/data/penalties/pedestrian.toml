note = "См. п. 1.5.5.2. Если снаряжение упало вне зоны дистанции и создаёт помехи другим участникам или зрителям, оно перемещается в зону дистанции на аналогичное расстояние от зоны финиша. Если снаряжение оставлено на ТО после финиша, участник (связка, группа) получает временной штраф — 1 минута."

