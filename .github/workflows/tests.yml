# Тесты на Windows, macOS и Linux после каждой отправки на GitHub — программа должна работать на всех трёх. Реальных данных здесь нет: тесты — на выдуманных и обезличенных.
name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Библиотеки (по uv.lock)
        run: uv sync --frozen --extra xls
      - name: Тесты
        run: uv run --frozen pytest -q -p no:warnings
      - name: Проверка стиля
        run: uv run --frozen ruff check src tests tools

  # Переносная версия: сборка для системы runner'а и полная проверка — распаковка, обновление через program.new,
  # запуск файлом .bat/.command/.sh, страницы, «Выключить»; на macOS и Linux — ещё установка через install.sh.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        target: [native]
        include:  # Mac с процессором Intel: сборка x86_64 на Mac с Apple M — через Rosetta
          - os: macos-latest
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.12"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Сборка
        run: |
          softwareupdate --install-rosetta --agree-to-license 2>/dev/null || true
          uv run --frozen python tools/build_portable.py build --target ${{ matrix.target }}
        shell: bash
      - name: Проверка архива
        shell: bash
        run: uv run --frozen python tools/check_portable.py build/st-secretary-windows.zip build/st-secretary-macos-*.tar.gz build/st-secretary-linux-*.tar.gz
