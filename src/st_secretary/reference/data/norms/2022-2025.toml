# Нормы, требования и условия их выполнения по виду спорта «спортивный туризм» на 2022–2025 годы.
# Утверждены приказом Минспорта России от 11.01.2022 № 6.
# Источник: rank_appl_2022_2025.pdf (tssr.ru), стр. 14 — раздел 4 «Нормы и условия их выполнения
# для присвоения I–III спортивных разрядов, юношеских спортивных разрядов» (группа «дистанция» и
# северная ходьба). Значения перенесены из rank_appl_2022_2025.xls и сверены со сканом PDF.
#
# Как читать таблицу:
#   * row.min — нижняя граница квалификационного ранга строки (строка действует до min следующей строки
#     в пределах своего класса; «N и более» — до конца диапазона класса);
#   * class_rows — какие строки относятся к каждому классу дистанции (в документе — незакрашенные
#     ячейки столбцов «Класс дистанции»); ранг ниже первой строки класса — нормы не выполняются;
#   * пороги — «результат участника в процентах от результата победителя (не более)»;
#     отсутствующий ключ = разряд в этой строке не присваивается (ячейка закрашена).

edition = "2022-2025"
title = "Нормы 2022–2025 (приказ Минспорта России от 11.01.2022 № 6)"
valid_from = "2022-01-01"
valid_to = "2025-12-31"

[source]             # документ — копия в программе (reference/docs, без интернета) и на сайте ФСТР (Правки, п. 59)
doc = "rank_appl_2022_2025.pdf"
url = "https://www.tssr.ru/files/materials/2733/rank_appl_2022_2025.pdf"  # проверено 06.10.2026, tssr.ru/main/docs/1896/
note = "Утверждены приказом Минспорта России от 11.01.2022 № 6. Документ — с сайта ФСТР (tssr.ru, «Документы»)."

[min_age]            # «выполняется с N лет» (достичь в календарный год соревнований)
I = 13
II = 12
III = 11
junior = 10

[nordic_walking]     # особенности для дисциплины «северная ходьба»
I_allowed = false    # графа «I (кроме спортивной дисциплины «северная ходьба»)»
min_age_II_III = 18

[status]             # «иные условия», п. 5–7
I = "regional"       # не ниже статуса других официальных спортивных соревнований субъекта РФ
II = "municipal"     # не ниже статуса первенства муниципального образования
III = "any"
junior = "any"

[junior_III]
# III юношеский разряд в этой редакции — не процент, а условие:
text = "В течение одного года три раза закончить дистанцию в контрольное время на официальных спортивных соревнованиях и (или) физкультурных мероприятиях любого статуса"

[class_rows]         # диапазон строк (по min) для каждого класса дистанции
1 = [0, 10]
2 = [0, 40]
3 = [20, 160]
4 = [63, 630]
5 = [200, 2400]
6 = [200, 2400]

