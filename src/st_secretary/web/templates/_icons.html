{# Значки — встроены в страницу, чтобы всё работало без интернета. #}
{% macro icon(name, size=20) -%}
<svg class="ico" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "logo" -%}<path d="M2.5 20 9 8.5l4 6.5 2.5-4L21.5 20z"/><path d="M9 8.5V3.5l4 1.5-4 1.5"/>
{%- elif name == "folder" -%}<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
{%- elif name == "table" -%}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>
{%- elif name == "upload" -%}<path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
{%- elif name == "download" -%}<path d="M12 4v11M7 10l5 5 5-5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>
{%- elif name == "check" -%}<path d="M5 12.5l4.5 4.5L19 7"/>
{%- elif name == "check-circle" -%}<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>
{%- elif name == "alert" -%}<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/>
{%- elif name == "error" -%}<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
{%- elif name == "info" -%}<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.3"/>
{%- elif name == "power" -%}<path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/>
{%- elif name == "plus" -%}<path d="M12 5v14M5 12h14"/>
{%- elif name == "archive" -%}<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/>
{%- elif name == "back" -%}<path d="M15 5l-7 7 7 7"/>
{%- elif name == "clock" -%}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{%- elif name == "phone" -%}<path d="M5 4h3.5l2 5-2.3 1.4a11 11 0 0 0 5.4 5.4L15 13.5l5 2V19a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>
{%- elif name == "wifi-off" -%}<path d="M3 3l18 18M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 5-2.7M14 10.3A10 10 0 0 1 19 13M2 9.5a15 15 0 0 1 4.5-2.8M11 5.1A15 15 0 0 1 22 9.5M12 20h.01"/>
{%- elif name == "laptop" -%}<rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/>
{%- elif name == "file" -%}<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>
{%- elif name == "edit" -%}<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>
{%- elif name == "arrow" -%}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- endif -%}
</svg>
{%- endmacro %}
